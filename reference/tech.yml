version: "1.0"
region: Tech / Tokens
region_code: TECH
code_series: 9501-9599
description: Internal reference codes for technical secrets and API tokens, mapping regex patterns and keyword categories.

entities:

  tech_generic_token:
    code: 9501
    description: Generic high-entropy secret token (32–64 hex/base64 chars)
    category: secret
    pii_type: credential
    severity: critical
    regex:
      - source: regex/hash/tokens.yml
        pattern_id: generic_token_01
    keyword:
      - source: keyword/network.yml
        category: url
        relevant_terms: [token, secret, key, api key, auth token, bearer]
        relevant_contexts: ["Token:", "Secret:", "Bearer:"]
    rerank:
      source: re-rank/scoring.yml
      category: ip_address

  tech_aws_access_key:
    code: 9502
    description: AWS Access Key ID (AKIA prefix + 16 uppercase alphanumeric chars)
    category: secret
    pii_type: credential
    severity: critical
    regex:
      - source: regex/hash/tokens.yml
        pattern_id: aws_access_key_01
    keyword:
      - source: keyword/network.yml
        category: url
        relevant_terms: [aws, access key, aws_access_key_id, amazon]
        relevant_contexts: ["AWS_ACCESS_KEY_ID:", "Access Key:"]
    rerank:
      source: re-rank/scoring.yml
      category: ip_address

  tech_aws_secret_key:
