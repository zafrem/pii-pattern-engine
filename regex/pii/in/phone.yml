namespace: in
description: India phone number patterns
patterns:
- id: mobile_01
  location: in
  category: phone
  description: Indian mobile phone number (10 digits starting with 6-9, optional +91/0091
    code)
  pattern: '(?:(?:\+|00)91[\t\n\f\r -]?)?[6-9][0-9]{9}'
  min_digit_run: 10
  mask: '**********'
  examples:
    match:
    - '9876543210'
    - '8123456789'
    - '7000000000'
    - '6999999999'
    - '+919876543210'
    - '+91 9876543210'
    - 0091 8123456789
    nomatch:
    - '5876543210'
    - '987654321'
    - '98765432100'
    - A876543210
    - '+929876543210'
  policy:
    store_raw: false
    action_on_match: redact
    severity: high
  match_type: exactly_matches
- id: landline_01
  location: in
  category: phone
  description: Indian landline number with STD code (optional +91/0091 code; the trunk
    0 is dropped when the international code is present)
  pattern: '(?:(?:(?:\+|00)91[\t\n\f\r -]?|0)[1-9][0-9]{1,3}-[0-9]{6,8}|(?:(?:\+|00)91[\t\n\f\r -]?|0)[1-9][0-9]{1,3}[0-9]{6,8})'
  min_digit_run: 6
  mask: 0***-********
  examples:
    match:
    - 011-12345678
    - 022-87654321
    - 080-23456789
    - 01112345678
    - '+91 11-12345678'
    - '+91 22-87654321'
    - 0091 80-23456789
    nomatch:
    - 00-12345678
    - 011-12345
    - 911-12345678
    - '+91 011-12345678'
  policy:
    store_raw: false
    action_on_match: report
    severity: low
  match_type: exactly_matches
